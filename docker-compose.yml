# === AI 法律助手 docker-compose.yml ===
services:
  # 服务一：Ollama（提供 embedding 模型）
  ollama:
    image: ollama/ollama
    container_name: legal-agent-ollama
    ports:
      - "11435:11434"  #端口映射，宿主机和容器有意义
    volumes:
      - ollama_models:/root/.ollama    # 拉取的模型持久化
    restart: unless-stopped

  # 服务二：Redis（仅作缓存；重启丢失缓存不影响 SQLite 会话或核心问答）
  redis:
    image: redis:7-alpine
    container_name: legal-agent-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 服务三：后端（FastAPI + 检索 + rerank）
  backend:
    build: .                            # 用当前目录的 Dockerfile 构建
    container_name: legal-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env                            # 注入 API key，不写进镜像
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # 覆盖代码里的 127.0.0.1
      - REDIS_URL=redis://redis:6379/0        # 容器网络中按服务名访问 Redis
      - HF_HOME=/models                 # bge-reranker 从挂载目录读
    volumes:
      - ./data:/app/data                # SQLite 数据持久化
      - D:/hf_cache:/models   # 复用模型缓存（只读；HF_HOME 已迁到 D 盘）
    depends_on:
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

# 命名卷声明
volumes:
  ollama_models:
